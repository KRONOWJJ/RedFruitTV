name: Build tvOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RedFruitTV/**"
      - "RedFruitTV.xcodeproj/**"
      - ".github/workflows/build.yml"

concurrency:
  group: redfruittv-tvos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  simulator-build:
    name: Compile for tvOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project RedFruitTV.xcodeproj

      - name: Build for Apple TV Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project RedFruitTV.xcodeproj \
            -scheme RedFruitTV \
            -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/RedFruitTVDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify and package simulator app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/RedFruitTVDerivedData/Build/Products/Debug-appletvsimulator/RedFruitTV.app"
          test -d "$APP_PATH"
          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/RedFruitTV-Simulator.zip"
          ls -lh "$RUNNER_TEMP/RedFruitTV-Simulator.zip"

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: RedFruitTV-tvOS-Simulator
          path: ${{ runner.temp }}/RedFruitTV-Simulator.zip
          if-no-files-found: error
          retention-days: 14
